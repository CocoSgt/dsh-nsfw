<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081829"/>
      <stop offset="1" stop-color="#03101c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="640" fill="url(#night)"/>
  <path d="M0,520 C150,490 300,530 450,510 C600,492 760,528 900,500 L900,640 L0,640 Z" fill="#0a2236"/>
  <path d="M0,560 C180,535 340,570 520,552 C700,535 800,562 900,548 L900,640 L0,640 Z" fill="#0d2c46"/>
  <text x="450" y="66" text-anchor="middle" fill="#9fd4ff" font-size="26" opacity=".85">深夜的海底,还有一盏灯。</text>
  <ellipse cx="470" cy="330" rx="230" ry="150" fill="url(#glow)"/>
  <!-- desk & laptop -->
  <rect x="300" y="470" width="300" height="16" rx="6" fill="#7a5230"/>
  <rect x="330" y="486" width="16" height="90" fill="#5c3d22"/>
  <rect x="554" y="486" width="16" height="90" fill="#5c3d22"/>
  <g transform="translate(430,410)">
    <rect x="-70" y="-52" width="140" height="96" rx="10" fill="#22303f"/>
    <rect x="-58" y="-40" width="116" height="72" rx="4" fill="#ffd98a"/>
    <text x="0" y="-8" text-anchor="middle" fill="#1b1b1b" font-size="17" font-weight="600">bug 修复中…</text>
    <rect x="-70" y="44" width="140" height="10" rx="4" fill="#161e28"/>
  </g>
  <!-- whale at desk, seen from behind-right -->
  <g transform="translate(620,320) rotate(8)">
    <path d="M-150,-10 C-195,-8 -225,18 -228,45 C-231,72 -205,95 -165,92 C-150,91 -138,84 -132,74 L-118,88 L-112,60 L-84,72 L-92,48 C-70,38 -62,18 -70,0 C-80,-24 -115,-13 -150,-10 Z" fill="#3f6ea8"/>
    <ellipse cx="-30" cy="20" rx="135" ry="80" fill="#4a7dbb"/>
    <path d="M95,40 C60,78 -40,82 -100,55 C-60,95 40,95 95,40 Z" fill="#bcd9f2" opacity=".85"/>
    <g transform="translate(-8,-70) rotate(12)">
      <path d="M0,0 L-30,-16 L-28,12 Z" fill="#ff9000"/>
      <path d="M0,0 L30,-16 L28,12 Z" fill="#ff9000"/>
      <circle r="8" fill="#e07800"/>
    </g>
    <!-- droopy eye -->
    <ellipse cx="-45" cy="8" rx="13" ry="9" fill="#0d0d0d"/>
    <circle cx="-49" cy="5" r="3.5" fill="#fff"/>
    <path d="M-64,-8 C-56,-14 -44,-14 -36,-8" stroke="#0d0d0d" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-60,34 C-72,44 -88,44 -98,36" stroke="#0d0d0d" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- coffee cup on desk -->
  <g transform="translate(340,440)">
    <rect x="-16" y="-22" width="32" height="26" rx="5" fill="#ff9000"/>
    <path d="M16,-16 a10,10 0 0,1 0,16" stroke="#ff9000" stroke-width="4" fill="none"/>
    <path d="M-6,-30 C-2,-38 2,-38 6,-30" stroke="#9fd4ff" stroke-width="3" fill="none" opacity=".7"/>
  </g>
  <text x="450" y="610" text-anchor="middle" fill="#5f89b3" font-size="16">第二话 · 鲸天加班</text>
</svg>
