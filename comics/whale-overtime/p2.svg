<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081829"/>
      <stop offset="1" stop-color="#03101c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="640" fill="url(#night)"/>
  <path d="M0,520 C150,490 300,530 450,510 C600,492 760,528 900,500 L900,640 L0,640 Z" fill="#0a2236"/>
  <!-- laptop close-up -->
  <g transform="translate(450,300)">
    <rect x="-260" y="-160" width="520" height="340" rx="18" fill="#22303f"/>
    <rect x="-240" y="-140" width="480" height="300" rx="8" fill="#101820"/>
    <!-- code lines -->
    <g font-family="Menlo,Consolas,monospace" font-size="19">
      <text x="-220" y="-104" fill="#7f8fa3">1  function fixBug() {</text>
      <text x="-220" y="-70" fill="#9fd4ff">2    whale.think(hard)</text>
      <text x="-220" y="-36" fill="#7f8fa3">3    tests.run()</text>
      <text x="-220" y="2" fill="#8ce99a">4    ✓ 14 passed</text>
      <text x="-220" y="36" fill="#7f8fa3">5  }</text>
      <text x="-220" y="70" fill="#ff9000">6  // 再改最后一个 bug(第 7 个)</text>
    </g>
  </g>
  <!-- whale peeking from screen corner -->
  <g transform="translate(660,120) rotate(-6)">
    <ellipse cx="0" cy="0" rx="72" ry="52" fill="#4a7dbb"/>
    <path d="M-52,18 C-20,48 30,50 58,28 C24,56 -34,56 -52,18 Z" fill="#bcd9f2" opacity=".85"/>
    <path d="M56,-26 C76,-24 88,-10 88,4 C88,18 74,28 56,26 L48,10 Z" fill="#3f6ea8"/>
    <ellipse cx="-14" cy="-4" rx="10" ry="8" fill="#0d0d0d"/>
    <circle cx="-17" cy="-7" r="3" fill="#fff"/>
    <path d="M-32,-16 C-26,-22 -16,-22 -10,-16" stroke="#0d0d0d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M-28,18 C-38,26 -50,26 -58,20" stroke="#0d0d0d" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(6,-44) rotate(-10)">
      <path d="M0,0 L-22,-12 L-20,10 Z" fill="#ff9000"/>
      <path d="M0,0 L22,-12 L20,10 Z" fill="#ff9000"/>
      <circle r="6" fill="#e07800"/>
    </g>
  </g>
  <g>
    <rect x="180" y="500" width="540" height="88" rx="22" fill="#f2f2f2"/>
    <path d="M450,588 L430,620 L492,588 Z" fill="#f2f2f2"/>
    <text x="450" y="554" text-anchor="middle" fill="#1b1b1b" font-size="25" font-weight="600">「改完这个 bug 就睡。……真的。」</text>
  </g>
</svg>
