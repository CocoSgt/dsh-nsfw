  <rect x="378" y="420" width="445" height="95" rx="22" fill="#FFFFFF" stroke="#DCDCF2" stroke-width="4"/>
  <rect x="730" y="385" width="120" height="60" rx="18" fill="#F0EEFF" stroke="#DCDCF2" stroke-width="3"/>

