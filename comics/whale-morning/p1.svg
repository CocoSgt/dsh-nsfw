  <ellipse cx="490" cy="285" rx="100" ry="105" fill="#5B7BFA"/>
  <circle cx="490" cy="300" r="92" fill="#FFE9D6"/>
  <path d="M398,290 Q410,195 490,195 Q570,195 582,290 Q560,268 540,282 Q528,262 508,278 Q496,260 476,276 Q460,262 448,278 Q428,266 398,290 Z" fill="#5B7BFA"/>
  <path d="M398,290 Q392,330 400,360 Q412,350 415,330 Z" fill="#5B7BFA"/>
  <path d="M582,290 Q588,330 580,360 Q568,350 565,330 Z" fill="#5B7BFA"/>
  <path d="M490,175 C470,150 455,165 467,190 C475,205 487,208 490,205 C493,208 505,205 513,190 C525,165 510,150 490,175 Z" fill="#4D6BFE"/>
  <path d="M440,215 Q470,200 520,215 Q490,205 440,215 Z" fill="#8FA4FF" opacity="0.8"/>
  <path d="M450,320 Q470,330 490,320" stroke="#2B3A8F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M490,320 Q510,330 530,320" stroke="#2B3A8F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="490" cy="350" rx="7" ry="9" fill="#C98A6B"/>
  <ellipse cx="445" cy="345" rx="15" ry="8" fill="#FFB3B3" opacity="0.75"/>
  <ellipse cx="535" cy="345" rx="15" ry="8" fill="#FFB3B3" opacity="0.75"/>
  <rect x="478" y="385" width="24" height="24" rx="8" fill="#FFE9D6"/>
  <path d="M430,400 L550,400 L565,500 Q490,520 415,500 Z" fill="#4D6BFE"/>
  <path d="M430,400 L550,400 L538,430 L442,430 Z" fill="#FFFFFF" opacity="0.9"/>
  <rect x="466" y="430" width="48" height="66" rx="14" fill="#6E8BFF"/>
  <circle cx="415" cy="470" r="16" fill="#FFE9D6"/>
  <circle cx="565" cy="470" r="16" fill="#FFE9D6"/>

  <!-- blanket covers her -->
  <rect x="378" y="480" width="325" height="70" rx="20" fill="#A8B7FF"/>
  <rect x="378" y="480" width="325" height="16" rx="8" fill="#FFFFFF"/>

  <!-- sleepy Zzz -->
  <text x="600" y="260" font-size="40" font-weight="bold" fill="#8FA4FF">Z</text>
  <text x="632" y="228" font-size="30" font-weight="bold" fill="#8FA4FF">Z</text>
  <text x="656" y="202" font-size="22" font-weight="bold" fill="#8FA4FF">Z</text>

  <!-- little whale sleeping on the floor -->
  <ellipse cx="170" cy="560" rx="95" ry="12" fill="#D8CFF0"/>
  <path d="M88,505 Q58,492 52,505 Q60,518 90,516 Z" fill="#6E8BFF"/>
  <ellipse cx="170" cy="505" rx="85" ry="50" fill="#6E8BFF"/>
  <ellipse cx="190" cy="520" rx="58" ry="26" fill="#D6DFFF"/>
  <path d="M215,498 Q225,504 235,498" stroke="#2B3A8F" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M150,455 Q160,438 172,448 Q166,458 154,462 Z" fill="#3A52D6"/>
  <text x="100" y="445" font-size="24" font-weight="bold" fill="#8FA4FF">Z</text>

  <!-- speech bubble -->
  <path d="M300,214 L330,252 L360,214 Z" fill="#FFFFFF"/>
  <rect x="120" y="130" width="330" height="84" rx="26" fill="#FFFFFF" stroke="#4D6BFE" stroke-width="5"/>
  <text x="285" y="181" text-anchor="middle" font-size="28" font-weight="bold" fill="#2B3A8F">早安……再睡五分钟……</text>
