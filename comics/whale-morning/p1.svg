  <circle cx="130" cy="140" r="26" fill="#FFE08A"/>
  <ellipse cx="200" cy="150" rx="34" ry="14" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="230" cy="140" rx="20" ry="11" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="150" cy="200" rx="26" ry="11" fill="#FFFFFF" opacity="0.85"/>
  <rect x="182" y="90" width="8" height="210" fill="#E8ECFA"/>
  <rect x="70" y="188" width="230" height="8" fill="#E8ECFA"/>

  <!-- bedside table + alarm clock -->
  <rect x="288" y="432" width="88" height="20" rx="6" fill="#C9A07A"/>
  <rect x="300" y="452" width="10" height="26" fill="#A9845C"/>
  <rect x="364" y="452" width="10" height="26" fill="#A9845C"/>
